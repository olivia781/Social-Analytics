<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Socials Tracking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #F4F2EE;
            color: #1a1a1a;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 30px 40px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 6px;
        }
        .header img {
            width: 48px;
            height: 48px;
        }
        h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #1a1a1a;
        }
        .subtitle {
            text-align: center;
            color: #888888;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 32px;
            letter-spacing: 0.3px;
        }
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }
        .card {
            background: #FFFFFF;
            border: 1px solid #e0ddd8;
            border-radius: 14px;
            padding: 26px 16px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        .card .value {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -1px;
        }
        .card .label {
            font-size: 12px;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .card:nth-child(1) .value { color: #CCE0FF; }
        .card:nth-child(2) .value { color: #99C2FF; }
        .card:nth-child(3) .value { color: #66A3FF; }
        .card:nth-child(4) .value { color: #3385FF; }
        .top-performer {
            text-align: center;
            color: #005CE5;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 36px;
            padding: 12px 24px;
            background: #FFFFFF;
            border: 1px solid #e0ddd8;
            border-radius: 10px;
            display: inline-block;
            width: 100%;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .chart-container {
            background: #005CE5;
            border-radius: 14px;
            padding: 24px;
            transition: transform 0.2s;
        }
        .chart-container:hover {
            transform: translateY(-1px);
        }
        .chart-container h2 {
            font-size: 16px;
            margin-bottom: 16px;
            font-weight: 600;
            color: #FFFFFF;
            letter-spacing: -0.3px;
        }
        .chart-wrapper {
            position: relative;
            height: 280px;
        }
        .chart-full {
            grid-column: 1 / -1;
        }
        @media (max-width: 768px) {
            body { padding: 16px; }
            .summary-cards { grid-template-columns: repeat(2, 1fr); }
            .charts-grid { grid-template-columns: 1fr; }
            .card .value { font-size: 28px; }
        }
    </style>
</head>
<body>
<div class="header">
    <img src="https://i.imgur.com/zdA3yc7.png" alt="Maket Logo">
    <h1>AI Socials Tracking</h1>
</div>
<div class="subtitle">Weekly Analytics</div>
<div class="summary-cards" id="summaryCards"></div>
<div class="top-performer" id="topPerformer"></div>
<div class="charts-grid">
    <div class="chart-container chart-full">
        <h2>Views Over Time</h2>
        <div class="chart-wrapper"><canvas id="viewsChart"></canvas></div>
    </div>
    <div class="chart-container">
        <h2>Likes Over Time</h2>
        <div class="chart-wrapper"><canvas id="likesChart"></canvas></div>
    </div>
    <div class="chart-container">
        <h2>Comments Over Time</h2>
        <div class="chart-wrapper"><canvas id="commentsChart"></canvas></div>
    </div>
    <div class="chart-container">
        <h2>Shares Over Time</h2>
        <div class="chart-wrapper"><canvas id="sharesChart"></canvas></div>
    </div>
    <div class="chart-container">
        <h2>Profile Views Over Time</h2>
        <div class="chart-wrapper"><canvas id="profileViewsChart"></canvas></div>
    </div>
</div>
<script>
var data = {
    weeks: ["Feb 9"],
    accounts: {
        "@homeinspooooo": {
            color: "#FAE5D8",
            views: [3848],
            likes: [92],
            comments: [0],
            shares: [6],
            profileViews: [19]
        },
        "@chrisbuildinhomes": {
            color: "#DEF8F7",
            views: [1302],
            likes: [12],
            comments: [0],
            shares: [0],
            profileViews: [9]
        },
        "@rachel_kollar": {
            color: "#F3D5F8",
            views: [2898],
            likes: [58],
            comments: [1],
            shares: [0],
            profileViews: [11]
        }
    }
};
function buildSummary() {
    var lastIdx = data.weeks.length - 1;
    var totalViews = 0, totalLikes = 0, totalProfileViews = 0, totalShares = 0;
    var topAccount = "", topViews = 0;
    var entries = Object.entries(data.accounts);
    for (var i = 0; i < entries.length; i++) {
        var name = entries[i][0];
        var acct = entries[i][1];
        var v = acct.views[lastIdx] || 0;
        totalViews += v;
        totalLikes += (acct.likes[lastIdx] || 0);
        totalProfileViews += (acct.profileViews[lastIdx] || 0);
        totalShares += (acct.shares[lastIdx] || 0);
        if (v > topViews) { topViews = v; topAccount = name; }
    }
    document.getElementById('summaryCards').innerHTML =
        '<div class="card"><div class="value">' + totalViews.toLocaleString() + '</div><div class="label">Total Views</div></div>' +
        '<div class="card"><div class="value">' + totalLikes.toLocaleString() + '</div><div class="label">Total Likes</div></div>' +
        '<div class="card"><div class="value">' + totalProfileViews.toLocaleString() + '</div><div class="label">Profile Views</div></div>' +
        '<div class="card"><div class="value">' + totalShares.toLocaleString() + '</div><div class="label">Total Shares</div></div>';
    document.getElementById('topPerformer').innerHTML =
        'Top performer: <strong>' + topAccount + '</strong> with ' + topViews.toLocaleString() + ' views';
}
var chartDefaults = {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
        legend: {
            labels: {
                color: '#FFFFFF',
                usePointStyle: true,
                pointStyle: 'circle',
                padding: 18,
                font: { family: 'Inter', size: 12, weight: '500' }
            }
        },
        tooltip: {
            backgroundColor: '#003d7a',
            titleColor: '#FFFFFF',
            titleFont: { family: 'Inter', weight: '600' },
            bodyColor: '#e0e0e0',
            bodyFont: { family: 'Inter' },
            borderColor: '#FFFFFF33',
            borderWidth: 1,
            padding: 14,
            cornerRadius: 10,
            displayColors: true,
            boxPadding: 6,
            callbacks: {
                label: function(ctx) {
                    return ' ' + ctx.dataset.label + ': ' + ctx.parsed.y.toLocaleString();
                }
            }
        }
    },
    scales: {
        x: {
            ticks: { color: '#FFFFFF99', font: { family: 'Inter', size: 11 } },
            grid: { color: '#FFFFFF15', drawBorder: false }
        },
        y: {
            ticks: {
                color: '#FFFFFF99',
                font: { family: 'Inter', size: 11 },
                callback: function(v) { return v.toLocaleString(); }
            },
            grid: { color: '#FFFFFF15', drawBorder: false }
        }
    }
};
function makeDatasets(metric) {
    var datasets = [];
    var entries = Object.entries(data.accounts);
    for (var i = 0; i < entries.length; i++) {
        var name = entries[i][0];
        var acct = entries[i][1];
        datasets.push({
            label: name,
            data: acct[metric],
            borderColor: acct.color,
            backgroundColor: acct.color + '44',
            borderWidth: 3,
            pointRadius: 6,
            pointHoverRadius: 10,
            pointBackgroundColor: acct.color,
            pointBorderColor: '#005CE5',
            pointBorderWidth: 2,
            tension: 0.35,
            fill: true
        });
    }
    return datasets;
}
function createChart(canvasId, metric) {
    var ctx = document.getElementById(canvasId).getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: data.weeks,
            datasets: makeDatasets(metric)
        },
        options: JSON.parse(JSON.stringify(chartDefaults))
    });
}
buildSummary();
createChart('viewsChart', 'views');
createChart('likesChart', 'likes');
createChart('commentsChart', 'comments');
createChart('sharesChart', 'shares');
createChart('profileViewsChart', 'profileViews');
</script>
</body>
</html>

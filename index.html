<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Socials Tracking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #F4F2EE;
            color: #1a1a1a;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 30px 40px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 6px;
        }
        .header img {
            width: 48px;
            height: 48px;
        }
        h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #1a1a1a;
        }
        .subtitle {
            text-align: center;
            color: #888888;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 24px;
            letter-spacing: 0.3px;
        }
        .platform-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .platform-tab {
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #e0ddd8;
            background: #FFFFFF;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
        }
        .platform-tab:hover {
            border-color: #005CE5;
            color: #005CE5;
        }
        .platform-tab.active {
            background: #005CE5;
            border-color: #005CE5;
            color: #FFFFFF;
        }
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }
        .card {
            background: #FFFFFF;
            border: 1px solid #e0ddd8;
            border-radius: 14px;
            padding: 26px 16px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        .card .value {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -1px;
            color: #005CE5;
        }
        .card .label {
            font-size: 11px;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .top-performer {
            text-align: center;
            color: #005CE5;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 36px;
            padding: 12px 24px;
            background: #FFFFFF;
            border: 1px solid #e0ddd8;
            border-radius: 10px;
            display: inline-block;
            width: 100%;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .chart-container {
            background: #CCE0FF;
            border-radius: 14px;
            padding: 24px;
            transition: transform 0.2s;
        }
        .chart-container:hover {
            transform: translateY(-1px);
        }
        .chart-container h2 {
            font-size: 16px;
            margin-bottom: 16px;
            font-weight: 600;
            color: #005CE5;
            letter-spacing: -0.3px;
        }
        .chart-wrapper {
            position: relative;
            height: 280px;
        }
        .chart-full {
            grid-column: 1 / -1;
        }
        .chart-hidden {
            display: none;
        }
        .loading {
            text-align: center;
            color: #005CE5;
            font-size: 16px;
            font-weight: 600;
            padding: 40px;
        }
        @media (max-width: 768px) {
            body { padding: 16px; }
            .summary-cards { grid-template-columns: repeat(2, 1fr); }
            .charts-grid { grid-template-columns: 1fr; }
            .card .value { font-size: 24px; }
        }
    </style>
</head>
<body>
<div id="authGate" style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px;">
    <h1 style="font-size:24px;font-weight:800;letter-spacing:-0.5px;">AI Socials Tracking</h1>
    <p style="color:#888;font-size:14px;">Enter password to view dashboard</p>
    <input id="pwInput" type="password" placeholder="Password"
        style="padding:12px 20px;border:1px solid #e0ddd8;border-radius:10px;font-family:'Inter',sans-serif;font-size:15px;width:260px;outline:none;background:#fff;"
        autofocus>
    <button id="pwBtn"
        style="padding:12px 32px;background:#005CE5;color:#fff;border:none;border-radius:10px;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;">
        Enter
    </button>
    <p id="pwError" style="color:#e53e3e;font-size:13px;display:none;">Incorrect password</p>
</div>
<div id="dashboard" style="display:none;">
<div class="header">
    <img src="https://i.imgur.com/zdA3yc7.png" alt="Maket Logo">
    <h1>AI Socials Tracking</h1>
</div>
<div class="subtitle">Weekly Analytics</div>
<div class="platform-tabs" id="platformTabs">
    <button class="platform-tab active" data-platform="all">All</button>
    <button class="platform-tab" data-platform="tiktok">TikTok</button>
    <button class="platform-tab" data-platform="instagram">Instagram</button>
    <button class="platform-tab" data-platform="youtube">YouTube</button>
    <button class="platform-tab" data-platform="pinterest">Pinterest</button>
</div>
<div class="summary-cards" id="summaryCards">
    <div class="loading">Loading data...</div>
</div>
<div class="top-performer" id="topPerformer"></div>
<div class="charts-grid">
    <div class="chart-container chart-full">
        <h2>Views Over Time</h2>
        <div class="chart-wrapper"><canvas id="viewsChart"></canvas></div>
    </div>
    <div class="chart-container chart-full">
        <h2>Impressions Over Time</h2>
        <div class="chart-wrapper"><canvas id="impressionsChart"></canvas></div>
    </div>
    <div class="chart-container" id="pinClicksContainer">
        <h2>Pin Clicks Over Time</h2>
        <div class="chart-wrapper"><canvas id="pinClicksChart"></canvas></div>
    </div>
    <div class="chart-container">
        <h2>Likes Over Time</h2>
        <div class="chart-wrapper"><canvas id="likesChart"></canvas></div>
    </div>
    <div class="chart-container">
        <h2>Comments Over Time</h2>
        <div class="chart-wrapper"><canvas id="commentsChart"></canvas></div>
    </div>
    <div class="chart-container">
        <h2>Shares Over Time</h2>
        <div class="chart-wrapper"><canvas id="sharesChart"></canvas></div>
    </div>
    <div class="chart-container">
        <h2>Profile Views Over Time</h2>
        <div class="chart-wrapper"><canvas id="profileViewsChart"></canvas></div>
    </div>
</div>
</div>
<script>
// Auth gate
var PASS_HASH = 'a90f5e04aa41eb39ebe7c2c23a4f241369d98ce31a8b8f3d0d2707d6dd6f3114';
async function hashPass(pw) {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');
}
async function checkAuth() {
    var pw = document.getElementById('pwInput').value;
    var h = await hashPass(pw);
    if (h === PASS_HASH) {
        sessionStorage.setItem('authed', '1');
        showDashboard();
    } else {
        document.getElementById('pwError').style.display = 'block';
        document.getElementById('pwInput').value = '';
    }
}
function showDashboard() {
    document.getElementById('authGate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
}
document.getElementById('pwBtn').addEventListener('click', checkAuth);
document.getElementById('pwInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') checkAuth();
});
if (sessionStorage.getItem('authed') === '1') showDashboard();

var data = null;
var currentPlatform = 'all';
var charts = {};

function getFilteredAccounts() {
    var entries = Object.entries(data.accounts);
    if (currentPlatform === 'all') return entries;
    return entries.filter(function(e) { return e[1].platform === currentPlatform; });
}

function buildSummary() {
    var lastIdx = data.weeks.length - 1;
    var totalViews = 0, totalImpressions = 0, totalLikes = 0, totalProfileViews = 0, totalShares = 0;
    var topAccount = "", topViews = 0;
    var filtered = getFilteredAccounts();
    for (var i = 0; i < filtered.length; i++) {
        var name = filtered[i][0];
        var acct = filtered[i][1];
        var v = acct.views[lastIdx] || 0;
        totalViews += v;
        totalImpressions += (acct.impressions[lastIdx] || 0);
        totalLikes += (acct.likes[lastIdx] || 0);
        totalProfileViews += (acct.profileViews[lastIdx] || 0);
        totalShares += (acct.shares[lastIdx] || 0);
        if (v > topViews) { topViews = v; topAccount = name; }
    }
    document.getElementById('summaryCards').innerHTML =
        '<div class="card"><div class="value">' + totalViews.toLocaleString() + '</div><div class="label">Total Views</div></div>' +
        '<div class="card"><div class="value">' + totalImpressions.toLocaleString() + '</div><div class="label">Impressions</div></div>' +
        '<div class="card"><div class="value">' + totalLikes.toLocaleString() + '</div><div class="label">Total Likes</div></div>' +
        '<div class="card"><div class="value">' + totalProfileViews.toLocaleString() + '</div><div class="label">Profile Views</div></div>' +
        '<div class="card"><div class="value">' + totalShares.toLocaleString() + '</div><div class="label">Total Shares</div></div>';
    if (topAccount && topViews > 0) {
        document.getElementById('topPerformer').innerHTML =
            'Top performer: <strong>' + topAccount + '</strong> with ' + topViews.toLocaleString() + ' views';
        document.getElementById('topPerformer').style.display = '';
    } else {
        document.getElementById('topPerformer').style.display = 'none';
    }
}

var chartDefaults = {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
        legend: {
            labels: {
                color: '#1a1a1a',
                usePointStyle: true,
                pointStyle: 'circle',
                padding: 18,
                font: { family: 'Inter', size: 12, weight: '500' }
            }
        },
        tooltip: {
            backgroundColor: '#005CE5',
            titleColor: '#FFFFFF',
            titleFont: { family: 'Inter', weight: '600' },
            bodyColor: '#e0e0e0',
            bodyFont: { family: 'Inter' },
            borderColor: '#FFFFFF33',
            borderWidth: 1,
            padding: 14,
            cornerRadius: 10,
            displayColors: true,
            boxPadding: 6,
            callbacks: {
                label: function(ctx) {
                    return ' ' + ctx.dataset.label + ': ' + ctx.parsed.y.toLocaleString();
                }
            }
        }
    },
    scales: {
        x: {
            ticks: { color: '#005CE599', font: { family: 'Inter', size: 11 } },
            grid: { color: '#005CE520', drawBorder: false }
        },
        y: {
            ticks: {
                color: '#005CE599',
                font: { family: 'Inter', size: 11 },
                callback: function(v) { return v.toLocaleString(); }
            },
            grid: { color: '#005CE520', drawBorder: false }
        }
    }
};

function makeDatasets(metric) {
    var datasets = [];
    var filtered = getFilteredAccounts();
    for (var i = 0; i < filtered.length; i++) {
        var name = filtered[i][0];
        var acct = filtered[i][1];
        var hasData = acct[metric] && acct[metric].some(function(v) { return v > 0; });
        if (!hasData) continue;
        datasets.push({
            label: name,
            data: acct[metric],
            borderColor: acct.color,
            backgroundColor: acct.color + '44',
            borderWidth: 3,
            pointRadius: 6,
            pointHoverRadius: 10,
            pointBackgroundColor: acct.color,
            pointBorderColor: '#CCE0FF',
            pointBorderWidth: 2,
            tension: 0.35,
            fill: true
        });
    }
    return datasets;
}

function createOrUpdateChart(canvasId, metric) {
    var datasets = makeDatasets(metric);
    if (charts[canvasId]) {
        charts[canvasId].data.labels = data.weeks;
        charts[canvasId].data.datasets = datasets;
        charts[canvasId].update();
    } else {
        var ctx = document.getElementById(canvasId).getContext('2d');
        charts[canvasId] = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.weeks,
                datasets: datasets
            },
            options: JSON.parse(JSON.stringify(chartDefaults))
        });
    }
}

function updatePinClicksVisibility() {
    var container = document.getElementById('pinClicksContainer');
    if (currentPlatform === 'pinterest' || currentPlatform === 'all') {
        var hasPinData = false;
        var filtered = getFilteredAccounts();
        for (var i = 0; i < filtered.length; i++) {
            if (filtered[i][1].pinClicks && filtered[i][1].pinClicks.some(function(v) { return v > 0; })) {
                hasPinData = true;
                break;
            }
        }
        container.classList.toggle('chart-hidden', !hasPinData);
    } else {
        container.classList.add('chart-hidden');
    }
}

function renderAll() {
    buildSummary();
    createOrUpdateChart('viewsChart', 'views');
    createOrUpdateChart('impressionsChart', 'impressions');
    createOrUpdateChart('likesChart', 'likes');
    createOrUpdateChart('commentsChart', 'comments');
    createOrUpdateChart('sharesChart', 'shares');
    createOrUpdateChart('profileViewsChart', 'profileViews');
    createOrUpdateChart('pinClicksChart', 'pinClicks');
    updatePinClicksVisibility();
}

// Platform tab clicks
document.getElementById('platformTabs').addEventListener('click', function(e) {
    if (!e.target.classList.contains('platform-tab')) return;
    var tabs = document.querySelectorAll('.platform-tab');
    for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
    e.target.classList.add('active');
    currentPlatform = e.target.getAttribute('data-platform');
    renderAll();
});

// Load data
fetch('data.json')
    .then(function(response) { return response.json(); })
    .then(function(json) {
        data = json;
        renderAll();
    })
    .catch(function(err) {
        console.error('Failed to load data:', err);
        document.getElementById('summaryCards').innerHTML =
            '<div class="loading">Failed to load analytics data.</div>';
    });
</script>
</body>
</html>
